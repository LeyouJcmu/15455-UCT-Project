<script type="text/markdown" data-md="mahaney1-statement">
## The statement

:::theorem (Mahaney, 1982)
If there is a sparse set $S$ such that $\SAT \redm S$, then $\P = \NP$.
:::

:::corollary
If $\P \ne \NP$, then no sparse set is NP-complete (or even NP-hard) under Karp reductions.
:::

Two things to notice:

- **$S$ need not be in NP.** The proof never uses an algorithm for $S$, so the theorem rules out sparse NP-*hard* sets, not just NP-complete ones.
- **The reduction type matters.** The theorem is about Karp (many-one) reductions. For more powerful reductions the picture changes; see [Page 7](consequences.html#stronger-reductions).

Our proof follows Ogihara and Watanabe (1991), who introduced the *left set* technique to prove a stronger theorem. Their method gives the cleanest known proof of Mahaney’s Theorem. A textbook account appears in Hemaspaandra and Ogihara, *The Complexity Theory Companion*, Chapter 1.
</script>

<script type="text/markdown" data-md="mahaney1-plan">
## The plan in four steps

1. **Search for one particular assignment.** Instead of asking “is $\varphi$ satisfiable?” we try to build the lexicographically largest satisfying assignment $z^*$ of $\varphi$, one bit at a time, by walking down the [self-reducibility tree](prerequisites.html#self-reducibility-of-sat).
2. **Turn that search into an NP question with a monotone answer.** Define a language $L$, the *left set*, that asks “is there a satisfying assignment at or to the right of this point?” Along any level of the tree, the points with answer “yes” form an initial segment ending exactly at the prefix of $z^*$.
3. **Reduce $L$ to the sparse set.** Since $L \in \NP$ and $S$ is NP-hard, $L \redm S$ via some $g$. We never decide $S$, but we compare $g$-values.
4. **Prune using collisions and the census.** At each level, keep only polynomially many candidate prefixes, using two rules that can never discard the prefix of $z^*$. At the bottom, check each surviving full assignment directly.
</script>

<script type="text/markdown" data-md="mahaney1-why-largest">
## Why the largest satisfying assignment?

A level of the tree has exponentially many nodes, and we can afford only polynomially many. We need a rule for which nodes are safe to throw away. Fixing a target ($z^*$, the rightmost satisfying leaf) and an order (left to right) gives us one: everything to the left of $z^*$’s path is a “yes” for $L$, everything to its right is a “no,” and $z^*$’s prefix is the *rightmost* “yes.” Both pruning rules exploit this picture.

![Eight leaves 000 to 111; the satisfying assignments are 010 and 101; leaves 000 through 101 are shaded as yes-instances of L and 110, 111 as no-instances](media/left-set.svg "The left set on the leaves of a 3-variable formula whose satisfying assignments are $010$ and $101$. The “yes” region runs from $0^n$ up to $z^* = 101$.")
</script>

<script type="text/markdown" data-md="mahaney1-lemmas">
## The lemmas

Fix a formula $\varphi$ with variables $x_1, \dots, x_n$. Let $z^*$ be its lexicographically largest satisfying assignment if $\varphi$ is satisfiable. For a prefix $u$ of length $k$, let $Q(u) = \enc{\varphi, u0^{n-k}}$.

| Lemma | Statement (informal) | Role in the proof |
| --- | --- | --- |
| [A](mahaney-proof.html#lemma-a) | The left set $L$ is in NP | Lets us reduce $L$ to $S$ |
| [B](mahaney-proof.html#lemma-b) | Among prefixes of length $k$, $Q(u) \in L$ exactly when $u \le z^*[1..k]$ | The “yes” prefixes form an initial segment ending at $z^*$’s prefix |
| [C](mahaney-proof.html#lemma-c) (collision rule) | If $u < v$ and $g(Q(u)) = g(Q(v))$, then $u$ is not $z^*$’s prefix | Safe to delete the smaller of two colliding prefixes |
| [D](mahaney-proof.html#lemma-d) (census rule) | If all $g$-values are distinct, $z^*$’s prefix is among the first $r$ candidates | Safe to keep only $r$ candidates per level |
| [Main](mahaney-proof.html#proof-of-mahaney) | The pruned search runs in polynomial time and decides SAT | Gives $\SAT \in \P$ |

Here $r$ is a polynomial bound on the number of strings in $S$ that $g$ can possibly output for inputs of this size.
</script>

<script type="text/markdown" data-md="mahaney1-takeaways">
:::takeaways
- Mahaney’s Theorem: a sparse NP-hard set would put SAT in P.
- The proof searches for the rightmost satisfying assignment and never needs to decide $S$.
- Collisions and the census bound let us keep only polynomially many nodes per level.
:::
