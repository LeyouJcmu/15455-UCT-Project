<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img" aria-labelledby="t d">
  <title id="t">Self-reducibility tree of a three-variable formula</title>
  <desc id="d">The root is the formula phi. Each level fixes one more variable to 0 (left) or 1 (right). The eight leaves are the full assignments 000 through 111 in lexicographic order.</desc>
  <rect width="680" height="300" fill="#fffefa"/>
  <g stroke="#9aa8a0" stroke-width="1.5" fill="none">
    <path d="M320 44 L160 110 M320 44 L480 110"/>
    <path d="M160 110 L80 180 M160 110 L240 180 M480 110 L400 180 M480 110 L560 180"/>
    <path d="M80 180 L40 244 M80 180 L120 244 M240 180 L200 244 M240 180 L280 244 M400 180 L360 244 M400 180 L440 244 M560 180 L520 244 M560 180 L600 244"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#647278" text-anchor="middle">
    <text x="232" y="70">0</text><text x="408" y="70">1</text>
    <text x="110" y="142">0</text><text x="210" y="142">1</text><text x="430" y="142">0</text><text x="530" y="142">1</text>
    <text x="52" y="214">0</text><text x="110" y="214">1</text><text x="212" y="214">0</text><text x="270" y="214">1</text>
    <text x="372" y="214">0</text><text x="430" y="214">1</text><text x="532" y="214">0</text><text x="590" y="214">1</text>
  </g>
  <g fill="#245c4b">
    <circle cx="320" cy="44" r="16"/>
    <circle cx="160" cy="110" r="11"/><circle cx="480" cy="110" r="11"/>
    <circle cx="80" cy="180" r="9"/><circle cx="240" cy="180" r="9"/><circle cx="400" cy="180" r="9"/><circle cx="560" cy="180" r="9"/>
  </g>
  <text x="320" y="50" fill="#fff" font-family="Georgia, serif" font-size="17" font-style="italic" text-anchor="middle">φ</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#202b30" text-anchor="middle">
    <g fill="#fffefa" stroke="#c6cfb7">
      <rect x="18" y="246" width="44" height="24" rx="3"/><rect x="98" y="246" width="44" height="24" rx="3"/>
      <rect x="178" y="246" width="44" height="24" rx="3"/><rect x="258" y="246" width="44" height="24" rx="3"/>
      <rect x="338" y="246" width="44" height="24" rx="3"/><rect x="418" y="246" width="44" height="24" rx="3"/>
      <rect x="498" y="246" width="44" height="24" rx="3"/><rect x="578" y="246" width="44" height="24" rx="3"/>
    </g>
    <text x="40" y="263">000</text><text x="120" y="263">001</text><text x="200" y="263">010</text><text x="280" y="263">011</text>
    <text x="360" y="263">100</text><text x="440" y="263">101</text><text x="520" y="263">110</text><text x="600" y="263">111</text>
  </g>
  <g font-family="Georgia, serif" font-size="14" font-style="italic" fill="#245c4b" text-anchor="start">
    <text x="640" y="82">x₁</text><text x="640" y="150">x₂</text><text x="640" y="218">x₃</text>
  </g>
  <text x="320" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#647278" text-anchor="middle" letter-spacing="1.2">0ⁿ  ←  LEXICOGRAPHIC ORDER  →  1ⁿ</text>
</svg>
