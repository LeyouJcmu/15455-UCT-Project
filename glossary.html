## Definitions

| Term | Definition | Introduced | Used on |
| --- | --- | --- | --- |
| $A^{\le n}$ | Strings in $A$ of length at most $n$ | [Page 2](prerequisites.html) | 4, 6 |
| Census $c_A(n)$ | $|A^{\le n}|$, the number of strings in $A$ of length at most $n$ | [Page 2](prerequisites.html#sparse-and-tally-sets-new) | 4, 6 |
| Karp reduction ($\redm$) | Polynomial-time $f$ with $x \in A$ iff $f(x) \in B$ | [Page 2](prerequisites.html) | All |
| NP-hard / NP-complete | Every NP language reduces to it / and it is in NP | [Page 2](prerequisites.html) | All |
| Sparse set | $c_S(n) \le p(n)$ for some polynomial $p$ | [Page 2](prerequisites.html#sparse-and-tally-sets-new) | 4–7 |
| Tally set | A subset of $\{1\}^*$ | [Page 2](prerequisites.html#sparse-and-tally-sets-new) | 4, 7 |
| Self-reducibility of SAT | $\varphi$ is satisfiable iff $\varphi[x_1{=}0]$ or $\varphi[x_1{=}1]$ is | [Page 2](prerequisites.html#self-reducibility-of-sat) | 6 |
| NPI | $\NP \setminus (\P \cup \NPC)$ | [Page 3](npi.html#theorem) | 3, 7 |
| $\SAT_H$ | Strings $\psi\,0\,1^{|\psi|^{H(|\psi|)}}$ with $\psi \in \SAT$ | [Page 3](npi.html#construction) | 3 |
| p-isomorphic ($\iso$) | Related by a polynomial-time bijection with polynomial-time inverse | [Page 4](sparse.html) | 4 |
| Paddable | Has an invertible polynomial-time padding function | [Page 4](sparse.html#all-known-np-complete-sets-are-p-isomorphic) | 4 |
| Left set $L$ | Pairs $\enc{\varphi, y}$ with a satisfying assignment $z \ge y$ | [Page 6](mahaney-proof.html#setup) | 6, 7 |
| $Q(u)$ | The query $\enc{\varphi, u0^{n-k}}$ for prefix $u$ of length $k$ | [Page 6](mahaney-proof.html#setup) | 6, 7 |
| $p_k$ | The length-$k$ prefix of the largest satisfying assignment $z^*$ | [Page 6](mahaney-proof.html#setup) | 6, 7 |
| $r$ | $p(q(\ell))$, the most $g$-values that can lie in $S$ | [Page 6](mahaney-proof.html#lemma-a) | 6, 7 |

<script type="text/markdown" data-md="glossary-theorems">
## Theorems

| Theorem | Statement | Page |
| --- | --- | --- |
| Ladner (1975) | If $\P \ne \NP$, then $\NPI \ne \varnothing$ | [3](npi.html) |
| Berman–Hartmanis (1977) | Paddable sets that reduce to each other are p-isomorphic | [4](sparse.html) |
| Mahaney (1982) | If a sparse set is NP-hard, then $\P = \NP$ | [5](mahaney.html), [6](mahaney-proof.html) |
| Corollary | If $\P \ne \NP$, every sparse set in $\NP \setminus \P$ is in NPI | [7](consequences.html#sparse-npi) |
| Fortune (1979) | If a sparse set is coNP-hard, then $\P = \NP$ | [7](consequences.html#fortune) |
| Ogihara–Watanabe (1991) | If a sparse set is NP-hard under $\redbtt$, then $\P = \NP$ | [7](consequences.html#stronger-reductions) |
| Karp–Lipton (1980) | If $\NP \subseteq \Ppoly$, then $\PH = \Sigma_2^p$ | [7](consequences.html#stronger-reductions) |
</script>

<script type="text/markdown" data-md="glossary-takeaways">
## Key takeaways

1. **NP is not a two-way split.** If $\P \ne \NP$, then problems strictly between P and NP-complete exist (Ladner).
2. **Density is a barrier to hardness.** A Karp reduction from SAT into a sparse set must collide heavily, and collisions reveal answers. So a sparse NP-hard set would make $\P = \NP$ (Mahaney).
3. **The left set is the key tool.** Searching for the rightmost satisfying assignment turns the “yes” region into an initial segment, which collisions and the census can prune safely.
4. **The two theorems meet.** Under $\P \ne \NP$, every sparse set in $\NP \setminus \P$ is NP-intermediate.
</script>
