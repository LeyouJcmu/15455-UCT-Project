<script type="text/markdown" data-md="mahaney1-statement">
## The statement

:::theorem (Mahaney, 1982)
If there is a sparse language $S$ such that $\SAT \redm S$, then $\P = \NP$.
:::

:::corollary
If $\P \ne \NP$, then no sparse language is NP-complete (or even NP-hard) under Karp reductions.
:::

We follow the proof by Ogihara and Watanabe (1991), who introduced a cleaner proof of Mahaney's theorem, using the left-set technique.
</script>

<script type="text/markdown" data-md="mahaney1-plan">
## The Proof Strategy

Assume there is a sparse language $S$ such that $\SAT \redm S$. We then give a polynomial-time algorithm deciding whether $\varphi$ with variables $x_1, \dots, x_n$ is satisfiable, without ever deciding $S$.

1. Create a language $L$, the left-set, asking whether there is a satisfying assignment at or to the right of a certain boolean assignment lexicographically. This creates a separation at the largest satisfying assignment.
2. Walk down the [self-reducibility tree](3_sparse.html#self-reducibility-of-sat), one level at a time, keeping a list of branches to search, maintaining an invariant that this list is always small enough, and the largest satisfying assignment is always within a leaf in the list of branches.
3. To maintain a small list, prune branches with the following fact:
   - $L$ is in $\NP$, so there is a mapping to $\SAT$, and from there, a mapping to a string in $S$.
   - Query branches by choosing the lexicographically smallest assignment in the branch, mapping it to an instance of $\SAT$, then to an instance of $S$. 
   - Remove all branches that have duplicate instances of $S$, keeping only the lexicographically largest branch, then only keep a polynomial amount of branches.
   - Note that branches in the tree correspond to prefixes of boolean assignments, which is how we keep track of the branches, choose assignments within branches, and order branches lexicographically.
4. At the end of the walk, there will be a small list of branches which correspond to leaves, that need to be checked. Since $S$ sparse, this list to check should be polynomially big, and can be checked one-by-one for a satisfying assignment.
</script>

<script type="text/markdown" data-md="mahaney1-lemmas">
## The lemmas

Let $\varphi$ with $x_1, \dots, x_n$. Let $z^*$ be the lexicographically largest satisfying assignment, assuming $\varphi$ is satisfiable. For a branch/prefix $u$ of length $k$, let $Q(u) = \enc{\varphi, u0^{n-k}}$, or the lexicographically smallest assignment (leaf) within the $u$ branch. Let $p_k = z^*[1..k]$ denote the length-$k$ prefix of $z^*$. Let $r$ be a polynomial bound on the size of the list of candidates. We will take it for granted for now, but I will define $r$ in the next page.

| Lemma | General Statement | Role in the proof |
| --- | --- | --- |
| [A](5_mahaney-proof.html#lemma-a) | $L \in \NP$ | Lets us reduce $L$ to $S$ |
| [B](5_mahaney-proof.html#lemma-b) | Among prefixes of length $k$, $Q(u) \in L$ exactly when $u \leq p_k$ | The “yes” prefixes form an initial segment ending at $z^*$’s prefix |
| [C](5_mahaney-proof.html#lemma-c) | If $u < v$ and $g(Q(u)) = g(Q(v))$, then $u$ cannot be $z^*$’s prefix | Safe to delete the smaller of two colliding prefixes |
| [D](5_mahaney-proof.html#lemma-d) | If all $g$-mapped values are unique, $z^*$’s prefix is among the first $r$ candidates | Safe to keep only $r$ candidates per level |
| [Main](5_mahaney-proof.html#proof-of-mahaney) | The algorithm runs in polynomial time and decides SAT | Gives $\SAT \in \P$ |
