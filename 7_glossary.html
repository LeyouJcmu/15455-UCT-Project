## Assumed background {#assumed-background}

Here are the background terms/definitions that I expect viewers of this lecture to know:

| Term | Definition | Used on |
| --- | --- | --- |
| $\P$ | Languages decided by a deterministic machine in polynomial time | All |
| $\NP$ | Languages $A$ with a polynomial-time verifier $V$ and polynomial $q$: $x \in A$ iff some certificate $w$ with $|w| \le q(|x|)$ makes $V(x, w)$ accept | All |
| Karp reduction ($\redm$) | Polynomial-time $f$ with $x \in A \iff f(x) \in B$. Reductions compose, and if $A \redm B$ and $B \in \P$ then $A \in \P$ | All |
| NP-hard / NP-complete | Every NP language reduces to it / and it is in NP | All |
| $\SAT$ | Satisfiable Boolean formulas; NP-complete by Cook–Levin | All |

## Definitions

Listed in the order they appear on the site.

### Ladner’s Theorem (Page 2)

| Term | Definition | Introduced | Used on |
| --- | --- | --- | --- |
| NPI | $\NP \setminus (\P \cup \NPC)$: languages in NP that are neither in P nor NP-complete (*NP-intermediate*) | [Page 2](2_npi.html#theorem) | 1, 2, 6 |
| Machine enumeration $M_1, M_2, \dots$ | A fixed list of all deterministic Turing machines, each appearing infinitely often; a universal machine simulates $M_i$ for $t$ steps in time polynomial in $i$ and $t$ | [Page 2](2_npi.html#construction) | 2 |
| $\ell(n)$ | $\lfloor \log \log n \rfloor$, the largest value $H(n)$ may take | [Page 2](2_npi.html#construction) | 2 |
| $H(n)$ | The smallest $i \le \ell(n)$ such that $M_i$ correctly decides $\SAT_H$ within $i \cdot \lvert x \rvert^i + i$ steps on every $x$ with $\lvert x \rvert \le \log n$; $\ell(n)$ if no such $i$ exists | [Page 2](2_npi.html#construction) | 2 |
| $\SAT_H$ | $\{\psi\,0\,1^{m^{H(m)}} : \psi \in \SAT,\ m = \lvert\psi\rvert\}$, SAT padded by an amount controlled by $H$ | [Page 2](2_npi.html#construction) | 2 |

### Sparse languages (Page 3)

| Term | Definition | Introduced | Used on |
| --- | --- | --- | --- |
| $\Sigma^{\le n}$, $A^{\le n}$ | Strings of length at most $n$; those that are in $A$ | [Page 3](3_sparse.html#sparse-and-tally-sets) | 3, 5 |
| Census $c_A(n)$ | $\lvert A^{\le n}\rvert$, the number of strings in $A$ of length at most $n$ | [Page 3](3_sparse.html#sparse-and-tally-sets) | 3, 5 |
| Sparse language | $c_S(n) \le p(n)$ for some polynomial $p$ | [Page 3](3_sparse.html#sparse-and-tally-sets) | 3–6 |
| Tally language | A subset of $\{1\}^*$; every tally language is sparse | [Page 3](3_sparse.html#sparse-and-tally-sets) | 3, 6 |
| Dense | Not sparse; e.g. $c_{\SAT}(n) = 2^{\Omega(n)}$ | [Page 3](3_sparse.html#sparse-and-tally-sets) | 3 |
| p-isomorphic ($\iso$) | $A \iso B$ if a bijection $f$ with $f$, $f^{-1}$ polynomial-time computable satisfies $x \in A \iff f(x) \in B$ | [Page 3](3_sparse.html#polynomial-isomorphism) | 3 |
| Paddable | $A$ has a polynomial-time, polynomial-time-invertible $\mathrm{pad}(x, y)$ with $\mathrm{pad}(x, y) \in A \iff x \in A$ | [Page 3](3_sparse.html#all-known-np-complete-languages-are-p-isomorphic) | 3 |
| Self-reducibility tree | Binary tree of partial assignments to $x_1, \dots, x_n$; $\varphi$ is satisfiable iff $\varphi[x_1{=}0]$ or $\varphi[x_1{=}1]$ is | [Page 3](3_sparse.html#self-reducibility-of-sat) | 3–5 |

### Mahaney’s Theorem (Pages 4–5)

| Term | Definition | Introduced | Used on |
| --- | --- | --- | --- |
| $f$ | The assumed Karp reduction from $\SAT$ to the sparse language $S$ | [Page 5](5_mahaney-proof.html#setup) | 5 |
| Left set $L$ | $\{\enc{\varphi, y} : \text{some satisfying } z \text{ has } z \ge y\}$, with $\ge$ lexicographic | [Page 5](5_mahaney-proof.html#setup) | 4, 5 |
| $z^*$ | The lexicographically largest satisfying assignment of $\varphi$ | [Page 4](4_mahaney.html#the-lemmas) | 4, 5 |
| $p_k$ | $z^*$’s length-$k$ prefix, the one candidate the algorithm must never delete | [Page 5](5_mahaney-proof.html#setup) | 5 |
| $Q(u)$ | $\enc{\varphi, u0^{n-k}}$, the query for the smallest assignment below prefix $u$ of length $k$ | [Page 5](5_mahaney-proof.html#setup) | 4, 5 |
| $g$ | The Karp reduction from $L$ to $S$, obtained from $L \redm \SAT$ (Cook–Levin) followed by $f$ | [Page 5](5_mahaney-proof.html#lemma-a) | 4, 5 |
| $q$ | A polynomial with $\lvert g(w)\rvert \le q(\lvert w\rvert)$ | [Page 5](5_mahaney-proof.html#lemma-a) | 5 |
| $\ell$ | $\lvert\enc{\varphi, 0^n}\rvert$, the common length of every query $Q(u)$ | [Page 5](5_mahaney-proof.html#lemma-a) | 5 |
| $r$ | $p(q(\ell))$: the most strings of $S$ any $g(Q(u))$ can equal, and so the cap on candidates per level | [Page 5](5_mahaney-proof.html#lemma-a) | 4, 5 |
| $C_k$ | The candidate prefixes of length $k$ kept by the algorithm | [Page 5](5_mahaney-proof.html#algorithm) | 5 |
| Collision rule | If two candidates have the same $g$-value, delete the smaller (safe by Lemma C) | [Page 5](5_mahaney-proof.html#lemma-c) | 5 |
| Census rule | After the collision rule, keep only the $r$ smallest candidates (safe by Lemma D) | [Page 5](5_mahaney-proof.html#lemma-d) | 5 |

### Extensions (Page 6)

| Term | Definition | Introduced | Used on |
| --- | --- | --- | --- |
| $\E$ | $\mathsf{DTIME}(2^{O(n)})$: languages decided deterministically in time $2^{cn}$ for some constant $c$ | [Page 6](6_consequences.html#sparse-npi) | 6 |
| $\NE$ | $\mathsf{NTIME}(2^{O(n)})$: the nondeterministic version of $\E$ | [Page 6](6_consequences.html#sparse-npi) | 6 |
| Bounded truth-table reduction ($\redbtt$) | A reduction that asks a constant number of non-adaptive questions to the target language | [Page 6](6_consequences.html#stronger-reductions) | 6 |
| Turing reduction ($\redT$) | A polynomial-time algorithm that may ask polynomially many adaptive questions to the target language | [Page 6](6_consequences.html#stronger-reductions) | 6 |
| $\Ppoly$ | Languages decided by polynomial-size circuit families | [Page 6](6_consequences.html#stronger-reductions) | 6 |
</script>

<script type="text/markdown" data-md="glossary-theorems">
## Theorems

| Result | Statement | Page |
| --- | --- | --- |
| Ladner (1975) | If $\P \ne \NP$, then $\NPI \ne \varnothing$ | [2](2_npi.html#theorem) |
| Berman–Hartmanis (1977) | Paddable languages that reduce to each other are p-isomorphic | [3](3_sparse.html#all-known-np-complete-languages-are-p-isomorphic) |
| Berman–Hartmanis Conjecture (1977, open) | All NP-complete languages are p-isomorphic; it would imply no sparse language is NP-complete | [3](3_sparse.html#all-known-np-complete-languages-are-p-isomorphic) |
| Mahaney (1982) | If $\SAT \redm S$ for a sparse language $S$, then $\P = \NP$ | [4](4_mahaney.html), [5](5_mahaney-proof.html#proof-of-mahaney) |
| Corollary of Mahaney | If $\P \ne \NP$, no sparse language is NP-hard under Karp reductions | [4](4_mahaney.html) |
| Corollary: sparse NPI | If $\P \ne \NP$, every sparse language in $\NP \setminus \P$ is in NPI | [6](6_consequences.html#sparse-npi) |
| Book (1974); Hartmanis–Immerman–Sewelson (1985) | $\NP \setminus \P$ contains a tally (resp. sparse) language iff $\E \ne \NE$, where $\E = \mathsf{DTIME}(2^{O(n)})$ | [6](6_consequences.html#sparse-npi) |
| Ogihara–Watanabe (1991) | If $\SAT \redbtt S$ for a sparse language $S$, then $\P = \NP$ | [6](6_consequences.html#stronger-reductions) |
| Karp–Lipton (1980) | If $\NP \subseteq \Ppoly$, then $\PH = \Sigma_2^p$ | [6](6_consequences.html#stronger-reductions) |
</script>
